# Optional automatic deploy to Cloudflare Workers on every push to main.
# Setup once: repo Settings > Secrets and variables > Actions > add CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard > My Profile > API Tokens > "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# Without the secrets this workflow does nothing, so it is safe to keep in forks.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - name: Test before deploying
        if: env.HAS_TOKEN == 'true'
        run: npm run typecheck && npm test
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
